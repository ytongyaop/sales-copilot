template: edu_training
name: 教培（成人职教）
thresholds:
  first_response_minutes: 30
  feedback_window_hours: 2
  stale_followup_days: 7
  zombie_ratio_max: 0.05
# 分级口径（ADR-0008）：分档只由规则算，模型不参与打分；权重与阈值只从这里读。
grading:
  # 四维权重，和为 1.0：金额 / 紧迫度 / 决策清晰度 / 需求匹配度。
  weights: {amount: 0.3, urgency: 0.3, clarity: 0.2, fit: 0.2}
  # 分档阈值：加权 ≥ a_min 且四维齐全 → A；≥ b_min → B；上下限跨档 → needs_info。
  bands:
    a_min: 0.75
    b_min: 0.45
  default_mode: propose        # propose（先提议后确认）| auto（直接采纳）
flow:
  - block: intake
  - block: first_contact
    label: 首次联系
  - block: qualify
    label: 需求确认
  - block: appointment
    label: 试听
  - block: proposal
    label: 方案报价
  - block: close
    label: 成交/关闭
card:
  sections:
    basic:
      label: 基础信息
      fields:
        - {key: company,  label: 单位/机构名称, question: "对方是什么单位或机构？"}
        - {key: industry, label: 所属领域, question: "他们主要做哪一块业务？"}
        - {key: size,     label: 规模, question: "大概多少人？"}
    needs:
      label: 需求与痛点
      fields:
        - {key: need,          label: 核心需求, question: "他们最想解决的问题是什么？"}
        - {key: pain_strength, label: 痛点强度, question: "这个问题现在有多急？不解决会怎样？"}
    decision:
      label: 决策流程与预算
      fields:
        - {key: decision_maker, label: 决策者, question: "最后谁签字？"}
        - {key: budget_range,   label: 预算区间, question: "预算大概在什么范围？"}
    followup:
      label: 跟进记录
      fields:
        - {key: next_step,     label: 下一步动作, question: "下次见面要谈什么？"}
        - {key: value_provided, label: 本次提供的价值, question: "这次我们给了什么新东西？"}
